services:
  app:
    build: .
    ports:
      - "8501:8501"   # Streamlit UI  -> http://localhost:8501
      - "8000:8000"   # /metrics      -> http://localhost:8000/metrics
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"   # Prometheus UI -> http://localhost:9090
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"   # Grafana UI    -> http://localhost:3000 (login: admin/admin)
    depends_on:
      - prometheus
